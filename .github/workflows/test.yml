name: test

on:
  push:
  pull_request:

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Unit tests
        run: |
          python -m pip install pytest
          python -m pytest
      - name: Simulated reServer bring-up
        run: ./scripts/reserver-up.sh --check
